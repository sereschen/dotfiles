init_commands:
  - sync-worktree-config

pr_branch_name_template: "wt-{number}-{generated}"
issue_branch_name_template: "wt-{number}-{generated}"
branch_name_script: "pi -p --model truefoundry-gemini-vertex/google-vertexai/gemini-3-flash-preview 'Generate a short, kebab-case branch name (max 20 chars, no prefix) summarizing this PR/issue. Output only the name, nothing else.'"

custom_commands:
  universal:
    t:
      description: Tmux with Pi only
      show_help: true
      tmux:
        session_name: "$WORKTREE_NAME"
        attach: true
        on_exists: switch
        windows:
          - name: ai
            command: pi
    ti:
      description: Tmux with Pi implements the ticket
      show_help: true
      tmux:
        session_name: "$WORKTREE_NAME"
        attach: true
        on_exists: switch
        windows:
          - name: ai
            command: pi "Read /tmp/grit-kickoff-$WORKTREE_NAME.md and follow it."
