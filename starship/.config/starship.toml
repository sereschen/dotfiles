"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
$os\
$username\
$hostname\
$sudo\
$fill\
$time
\
$directory\
$git_branch\
$fill\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
\
$python
$character"""

palette = 'catppuccin_mocha'

[fill]
symbol = " "


[os]
disabled = false
format = "[ $symbol]($style)"

[os.symbols]
Windows = " "
Ubuntu = "󰕈 "
SUSE = " "
Raspbian = "󰐿 "
Mint = "󰣭 "
Macos = "󰀵 "
Manjaro = " "
Linux = "󰌽 "
Gentoo = "󰣨 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Android = " "
Arch = "󰣇 "
Artix = "󰣇 "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
RockyLinux = " "

[username]
show_always = true
format = '[$user ]($style)'

[directory]
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[sudo]
symbol = ""
format = "[$symbol  ]($style)"
disabled = true


[hostname]
ssh_only = true
format = '[@$hostname ]($style)'
trim_at = '.companyname.com'
disabled = false
aliases = { "Sergios-MacBook-Pro.local" = "local", "philo-alpha-staging" = "staging" }


[git_branch]
symbol = " "
format = '[$symbol $branch]($style)'


[nodejs]
symbol = " "
format = '[ $symbol( $version) ]($style)'

[bun]
symbol = ""
format = '[ $symbol( $version) ]($style)'

[c]
symbol = " "
format = '[ $symbol( $version) ]($style)'

[rust]
symbol = " "
format = '[ $symbol( $version) ]($style)'

[golang]
symbol = " "
format = '[ $symbol( $version) ]($style)'

[php]
symbol = " "
format = '[ $symbol( $version) ]($style)'

[java]
symbol = " "
format = '[ $symbol( $version) ]($style)'

[kotlin]
symbol = " "
format = '[ $symbol( $version) ]($style)'

[haskell]
symbol = " "
format = '[ $symbol( $version) ]($style)'

[python]
symbol = " "
format = '[ $symbol( $version)(\(#$virtualenv\)) ]($style)'

[time]
disabled = false
time_format = "%R"
format = '[  $time ]($style)'

[character]
disabled = false
success_symbol = '[ ❯](bold fg:green)'
error_symbol = '[ ❯](bold fg:red)'
vimcmd_symbol = '[ ❮](bold fg:green)'
vimcmd_replace_one_symbol = '[ ❮](bold fg:lavender)'
vimcmd_replace_symbol = '[ ❮](bold fg:lavender)'
vimcmd_visual_symbol = '[ ❮](bold fg:yellow)'


[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
